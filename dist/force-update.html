<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Operator40 — Forza aggiornamento</title>
<style>
  body{font-family:system-ui,-apple-system,sans-serif;background:#1B1D16;color:#EDE8D8;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:20px;text-align:center}
  .card{background:#242820;border:1px solid #4A5233;border-radius:16px;padding:24px;max-width:400px}
  h1{color:#C1440E;font-size:20px;margin:0 0 10px}
  p{color:#B8AE8C;font-size:13px;line-height:1.5}
  button{background:#C1440E;color:#EDE8D8;border:none;border-radius:12px;padding:14px 20px;font-weight:700;font-size:14px;cursor:pointer;width:100%;margin-top:14px}
  .mono{font-family:ui-monospace,monospace;font-size:10px;color:#8A9078;margin-top:10px}
</style>
</head>
<body>
<div class="card">
  <h1>🔄 Forza aggiornamento</h1>
  <p>Tocca sotto per pulire la cache PWA bloccata su <span id="ver">...</span> e caricare l’ultima versione. Non disinstalla l’app.</p>
  <button id="btn" onclick="doUpdate()">Pulisci cache e aggiorna</button>
  <p class="mono" id="log">Pronto...</p>
  <p style="margin-top:12px"><a href="./" style="color:#B8AE8C;font-size:12px">← Torna alla app</a></p>
</div>
<script>
  const log = (m)=> document.getElementById('log').textContent = m;
  document.getElementById('ver').textContent = new Date().toLocaleString('it-IT');
  async function doUpdate(){
    const btn = document.getElementById('btn');
    btn.disabled = true; btn.textContent = 'Pulizia...';
    log('Unregister SW...');
    try{
      if('serviceWorker' in navigator){
        const regs = await navigator.serviceWorker.getRegistrations();
        for(const r of regs){ await r.unregister(); log('SW rimosso: '+r.scope); }
      }
      if(window.caches){
        const keys = await caches.keys();
        for(const k of keys){ await caches.delete(k); log('Cache rimossa: '+k); }
      }
      try{ localStorage.removeItem('o40_lastSw'); }catch{}
      try{ sessionStorage.clear(); }catch{}
      log('Fatto — ricarico...');
      setTimeout(()=> location.href = './?v=' + Date.now() + '#force', 600);
    }catch(e){
      log('Errore: '+e.message);
      btn.disabled = false; btn.textContent = 'Riprova';
    }
  }
  // auto-run se ?auto=1
  if(location.search.includes('auto')){ setTimeout(doUpdate, 800); }
</script>
</body>
</html>
