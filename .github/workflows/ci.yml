name: CI

on:
  push:
    branches: [main, deploy-tmp]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run test
      - run: npm run build
      - name: Check no uncommitted dist diff (deterministic build)
        run: |
          git diff --stat
          if ! git diff --quiet -- dist/; then
            echo "::warning::dist/ differs from committed — did you forget npm run build + git add -f dist ?"
            git diff --stat -- dist/
          fi
